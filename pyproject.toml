[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-curator"
version = "0.2.0"
description = "Receipt-backed audiobook curation and M4B validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ScriptedAlchemy"}]
keywords = ["audiobook", "m4b", "ffmpeg", "audible"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
acoustic = ["audiolocate>=0.1"]
dev = ["pytest>=8"]

[project.scripts]
audiobook-curator = "audiobook_curator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
