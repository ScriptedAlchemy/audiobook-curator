name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Audiobook Forge compatibility target
        if: matrix.python-version == '3.13'
        run: cargo install audiobook-forge --version 2.11.2 --locked
      - name: Install
        run: python -m pip install build && python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Representative M4B workflow
        run: python scripts/fixture_workflow.py
      - name: Validate plugin and skill manifests
        run: python scripts/validate_repository.py
      - name: Build and smoke-test package and wrapper
        run: |
          python -m build
          ./bin/audiobook-curator --help
          for command in inventory library-audit select convert audible-search audible-select audible-cache apply-metadata apply-chapters acoustic-verify whisper-verify audit; do
            ./bin/audiobook-curator "$command" --help >/dev/null
          done
